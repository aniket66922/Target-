<!doctype html>
<html>
<head>
  <title>{{ 'Edit' if user else 'Add' }} User</title>
  <style>
    body { font-family: Arial; background: #f2f4f8; display: flex; justify-content: center; padding-top: 60px; }
    form { background: white; padding: 30px; border-radius: 10px; width: 300px; box-shadow: 0 2px 10px rgba(0,0,0,.1); }
    input, select, button { width: 100%; padding: 10px; margin-top: 10px; box-sizing: border-box; }
    button { background: #3b6cf6; color: white; border: none; border-radius: 5px; cursor: pointer; }
    .msg { color: red; }
  </style>
</head>
<body>
  <form method="post">
    <h2>{{ 'Edit' if user else 'Add' }} User</h2>
    {% for m in get_flashed_messages() %}<p class="msg">{{ m }}</p>{% endfor %}
    <input name="name" placeholder="Name" value="{{ user.name if user else '' }}" required>
    <input name="email" type="email" placeholder="Email" value="{{ user.email if user else '' }}" required>
    <select name="status">
      <option value="active" {{ 'selected' if user and user.status == 'active' }}>Active</option>
      <option value="blocked" {{ 'selected' if user and user.status == 'blocked' }}>Blocked</option>
    </select>
    <button type="submit">Save</button>
    <p><a href="{{ url_for('users') }}">Back</a></p>
  </form>
</body>
</html>
